# NOW! Engine — production compose for the VPS (helios).
#
# This is NOT the root docker-compose.yml. That one is the local dev stack:
# it builds from source, publishes ports on 0.0.0.0, and runs Caddy for TLS.
# None of those are right on a shared host. Differences, and why:
#
#   1. NO CADDY. helios's host nginx already owns 80/443 and terminates TLS
#      with certs under /etc/nginx/ssl-certificates/. A containerised Caddy
#      would fail to bind, or worse, win the race and break every other site
#      on the box. Routing is an nginx vhost per hostname -> 127.0.0.1:port.
#
#   2. PORTS ARE LOOPBACK-ONLY. `127.0.0.1:` is not decoration. Without it
#      Docker publishes on 0.0.0.0 AND writes its own iptables rules, which
#      bypass ufw entirely — the app would be reachable from the internet on
#      a raw unencrypted port while `ufw status` still claimed only 80/443
#      were open.
#
#   3. IMAGES ARE PULLED, NEVER BUILT. `next build` is the memory-hungry
#      step that gets OOM-killed on a small box, with an error that reads
#      like a code fault rather than a capacity one. CI builds and pushes to
#      GHCR; see .github/workflows/publish-images.yml.
#
#   4. HOST PORTS ARE VARIABLES. The defaults below are chosen to avoid what
#      is already bound on helios, but this is a shared box and the next
#      project will not know about us. Anything colliding is a one-line .env
#      change, not a code change.
#
# Sizing note. helios is 8 vCPU / 32 GB with ~25 GB available and 172 GB of
# disk, running only a server-side GTM pair in Docker. That is more headroom
# than ARCHITECTURE.md §2's own target (a Hetzner CPX41, 8 vCPU / 16 GB), so
# the limits below are working room rather than the starvation values an
# earlier draft needed for a 2 vCPU / 4 GB box. They total ~11.5 GB with the
# `media` profile off.
#
# The limits still exist on purpose: they make an OOM land on the container
# that caused it rather than on Postgres, and they stop one runaway Payload
# instance taking the box down for the other sites hosted here.
#
# Runbook: docs/DEPLOY.md. Driver: deploy/deploy.sh (do not roll out by hand).

name: now-engine

# There is no `x-cms-shared` any more, and its absence is the point.
#
# It used to carry the Payload runtime's environment for two standalone
# `cms-<city>` services. Phase 2 of docs/ADMIN-CONSOLIDATION.md moved Payload
# into `web-<city>` and deleted those services — but left the anchor behind,
# referenced by nothing. YAML does not complain about an unused anchor, and
# `docker compose config` renders a valid file, so nothing ever failed. What
# happened instead is that everything in it silently stopped reaching Payload:
#
#   REDIS_URL   — `packages/cms/src/lib/redis.ts` logs "REDIS_URL is not set —
#                 domain events will not be emitted" and returns false from
#                 every publish. So `article.published` has not reached the
#                 worker's re-embed consumer since consolidation, and
#                 `classification.reviewed` would have gone nowhere either.
#   GARAGE_*    — `Media` is `disableLocalStorage: true`, so with no S3
#                 credentials an upload has no destination at all. This is one
#                 of two obstacles to media, not the whole story: `garage` and
#                 `imgproxy` also sit behind the `media` profile and have never
#                 been started on helios, because E1.3 (mirroring
#                 wp-content/uploads into the bucket) is still blocked. See
#                 DEPLOY.md section 6. Restoring the variables is necessary and
#                 not sufficient.
#
# Everything it held now lives in `x-web-shared` below, which is the anchor
# the services that run Payload actually use.

# Shared by both reader-site instances. SITE_SLUG is deliberately NOT here:
# it is the one thing that differs, and an anchor carrying the differentiator
# only works by accident of override order.
x-web-shared: &web-shared
  NODE_ENV: production
  ENGINE_API_URL: http://engine-api:8000
  # NOW_REPO_ROOT is NOT set here: the image bakes the city config in and
  # sets it itself. Overriding it from compose would point the app at a path
  # that does not exist in the container.
  # The reader app now reads content through Payload's Local API against its
  # own city database (docs/ui-data-layer.md), and serves the admin at
  # /team-editor (docs/ADMIN-CONSOLIDATION.md Phase 2). DATABASE_URI is
  # per-city and therefore set on each service, not here.
  #
  # PLATFORM_DATABASE_URI: the shared Payload config loads the taxonomy
  # vocabulary from the platform at startup.
  # PLATFORM_DATABASE_URL: the commerce pages' own read-only pool. Two names
  # for one database because the console arrived with its own convention;
  # unifying them is a rename across both apps and belongs in its own change.
  PLATFORM_DATABASE_URI: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/now_platform
  PLATFORM_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/now_platform
  # Signs and verifies the staff session cookie. The city apps cannot check a
  # password — the credential lives in the platform — so this secret is what
  # makes a sign-in trustworthy.
  PAYLOAD_SECRET: ${PAYLOAD_SECRET:?}
  # The domain-event transport. Payload announces `article.published` and
  # `classification.reviewed` on it and the worker consumes them; without it
  # every publish is a no-op that logs and returns false, which is what has
  # been happening since the admin moved in here. Plain `REDIS_URL`, not the
  # `ENGINE_*_REDIS_URL` spelling the Python services read — the CMS reads
  # this name (packages/cms/src/lib/redis.ts).
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
  # Media has nowhere to go without these: `Media` sets
  # `disableLocalStorage: true`, so the S3 adapter is the only destination.
  # Left defaulting to empty rather than `:?` so a deployment that has not
  # provisioned Garage credentials still boots — the symptom is then a failing
  # upload, which is visible, instead of a stack that will not start. On helios
  # the credentials are real but `garage` itself is not running (media profile,
  # DEPLOY.md section 6), so these point at a service that has to be turned on
  # in the same change that unblocks the mirror.
  GARAGE_S3_ENDPOINT: http://garage:3900
  GARAGE_ACCESS_KEY_ID: ${GARAGE_ACCESS_KEY_ID:-}
  GARAGE_SECRET_ACCESS_KEY: ${GARAGE_SECRET_ACCESS_KEY:-}
  GARAGE_MEDIA_BUCKET: ${GARAGE_MEDIA_BUCKET:-now-media}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

networks:
  now-internal:
    name: now-internal

volumes:
  postgres-data:
  redis-data:
  garage-meta:
  garage-data:

services:
  # ---------------------------------------------------------------------
  # Postgres 16 + pgvector + PostGIS — three databases (ARCHITECTURE.md §2).
  # Custom image: no published tag carries both extensions.
  # ---------------------------------------------------------------------
  postgres:
    image: ${POSTGRES_IMAGE:?set POSTGRES_IMAGE}:${IMAGE_TAG:?set IMAGE_TAG}
    container_name: now-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # Deliberately NOT published, not even on loopback. Reach it with
    # `docker exec now-postgres psql`, or an SSH tunnel for external tooling.
    networks: [now-internal]
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 4g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  redis:
    image: redis:7.4.11-alpine
    container_name: now-redis
    restart: unless-stopped
    # The healthcheck below runs `redis-cli -a $REDIS_PASSWORD` INSIDE the
    # container ($$ escapes it past compose's own interpolation), so the
    # variable has to exist in the container's environment. `command:` alone
    # does not put it there -- it only passes the value as an argv token.
    #
    # Without this block the probe authenticates with an empty string and
    # redis answers `WRONGPASS`, so the container runs perfectly while
    # reporting unhealthy forever, and deploy.sh's health gate fails every
    # rollout. The root docker-compose.yml has always had this block; it was
    # dropped when this file was derived from it.
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?}
      --appendonly yes
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    networks: [now-internal]
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s

  # ---------------------------------------------------------------------
  # engine-api — ONE instance for every city. Site comes from the request
  # path (/v1/{site}/...), resolved through the sites registry.
  # ---------------------------------------------------------------------
  engine-api:
    image: ${API_IMAGE:?set API_IMAGE}:${IMAGE_TAG:?}
    container_name: now-engine-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:${API_HOST_PORT:-4310}:8000"
    environment:
      # Every name is prefixed ENGINE_API_ — app/config.py sets
      # env_prefix="ENGINE_API_", so an unprefixed PLATFORM_DATABASE_URI is
      # silently ignored and the app quietly falls back to localhost.
      ENGINE_API_ENV: production
      ENGINE_API_LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ENGINE_API_PLATFORM_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/now_platform
      # City pools are built from these, not from one URI: sites.db_ref
      # usually holds a bare database name and config.build_city_dsn()
      # supplies the rest. Adding a city is a registry row, not a redeploy.
      ENGINE_API_CITY_DB_HOST: postgres
      ENGINE_API_CITY_DB_PORT: "5432"
      ENGINE_API_CITY_DB_USER: ${POSTGRES_USER}
      ENGINE_API_CITY_DB_PASSWORD: ${POSTGRES_PASSWORD}
      # The ENGINE_API_* block above configures the ASYNC pool that
      # `Depends(get_city_db)` hands out. It is not the only way this service
      # reaches Postgres: `/search` and `/articles/{id}/rails` compose the
      # sync {now_search, now_filters, now_blender} stack, which resolves its
      # own connections through `now_db.settings` and therefore reads NOW_PG_*.
      #
      # Without these the sync path defaults to localhost:5432 and every rails
      # or search request fails with `connection refused`, while /healthz and
      # /v1/{site}/health keep answering 200 because they only touch the async
      # pool. Found exactly that way on helios.
      NOW_PG_HOST: postgres
      NOW_PG_PORT: "5432"
      NOW_PG_USER: ${POSTGRES_USER}
      NOW_PG_PASSWORD: ${POSTGRES_PASSWORD}
      ENGINE_API_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [now-internal]
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1g
    healthcheck:
      # /healthz, not /v1/health — the latter lives under the
      # /v1/{site} router and would need a real site slug to answer.
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=4).status==200 else 1)\""]
      interval: 15s
      timeout: 6s
      retries: 10
      start_period: 25s

  # ---------------------------------------------------------------------
  # engine-worker — ONE instance for every city. It iterates the site
  # registry (engine.sites), so a new region is a row, not a redeploy.
  #
  # Runs two things: arq cron (partition maintenance) and, in a supervised
  # thread, the existing re-embed-on-publish stream consumer. The most
  # important job is the least glamorous — engine.interactions and
  # engine.impressions are daily-partitioned and an INSERT for a date with
  # no partition FAILS, so running out of them is total loss of behavioural
  # data that ARCHITECTURE.md §19 says cannot be backfilled.
  #
  # No port: liveness is a Redis heartbeat, because a container that is
  # "running" only proves PID 1 has not exited while arq is wedged.
  # ---------------------------------------------------------------------
  engine-worker:
    image: ${WORKER_IMAGE:?set WORKER_IMAGE}:${IMAGE_TAG:?}
    container_name: now-engine-worker
    restart: unless-stopped
    environment:
      ENGINE_WORKER_PLATFORM_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/now_platform
      ENGINE_WORKER_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      ENGINE_WORKER_LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ENGINE_WORKER_PARTITION_DAYS_AHEAD: "${PARTITION_DAYS_AHEAD:-14}"
      # Unset means never drop. Dropping a partition destroys behavioural
      # data permanently and E7 is data-gated on accumulating it.
      ENGINE_WORKER_INTERACTION_RETENTION_DAYS: "${INTERACTION_RETENTION_DAYS:-}"
      ENGINE_WORKER_RUN_REEMBED_CONSUMER: "${RUN_REEMBED_CONSUMER:-true}"
      # now_db.settings builds each city DSN from these (db_ref is a bare
      # database name — every city is on this one Postgres instance).
      NOW_PG_HOST: postgres
      NOW_PG_PORT: "5432"
      NOW_PG_USER: ${POSTGRES_USER}
      NOW_PG_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [now-internal]
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1g

  # ---------------------------------------------------------------------
  # web-{city} — the reader site.
  #
  # ONE INSTANCE PER CITY, not one for both. src/lib/site.ts requires
  # SITE_SLUG and says so plainly: "This app serves exactly one city per
  # process". There is no hostname routing in it today, so a single service
  # fed two hostnames would throw at startup.
  #
  # The city config is BAKED INTO THE IMAGE, not mounted. It used to be
  # mounted from the checkout so that a brand or nav change was a restart
  # rather than a rebuild. That benefit was never once used, and the cost was
  # a silent drift trap: pull a new image without pulling the repo and new
  # code runs against old config, with no error anywhere — a footer missing
  # the links the build added, a favicon falling back to the wordmark. Both
  # return 200 and pass a smoke test.
  #
  # So the image now carries its own config and cannot disagree with itself,
  # and a config change goes through CI like any other change. §3.5 still
  # holds: nothing city-specific is COMPILED in, both cities' rows ship in one
  # image, and SITE_SLUG selects which is read at startup.
  # ---------------------------------------------------------------------
  web-jakarta:
    image: ${WEB_IMAGE:?set WEB_IMAGE}:${IMAGE_TAG:?}
    container_name: now-web-jakarta
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_JAKARTA_HOST_PORT:-4311}:3100"
    environment:
      <<: *web-shared
      SITE_SLUG: jakarta
      DATABASE_URI: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/now_jakarta
    depends_on:
      engine-api:
        condition: service_healthy
      # Payload runs in here and announces domain events on Redis. Waiting for
      # it is not strictly required — `publishDomainEvent` never throws and a
      # dropped announcement only costs one re-embed — but a city that boots
      # before its transport publishes nothing for the first few seconds and
      # says so only in a log nobody is reading at that moment.
      redis:
        condition: service_healthy
    networks: [now-internal]
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 768m

  web-bali:
    image: ${WEB_IMAGE:?}:${IMAGE_TAG:?}
    container_name: now-web-bali
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_BALI_HOST_PORT:-4315}:3100"
    environment:
      <<: *web-shared
      SITE_SLUG: bali
      DATABASE_URI: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/now_bali
    depends_on:
      engine-api:
        condition: service_healthy
      # Payload runs in here and announces domain events on Redis. Waiting for
      # it is not strictly required — `publishDomainEvent` never throws and a
      # dropped announcement only costs one re-embed — but a city that boots
      # before its transport publishes nothing for the first few seconds and
      # says so only in a log nobody is reading at that moment.
      redis:
        condition: service_healthy
    networks: [now-internal]
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 768m

  # ---------------------------------------------------------------------
  # console — partner + campaign management.
  #
  # ONE instance for every city: it reads the PLATFORM database only (§2),
  # so there is no SITE_SLUG here and nothing per-city about it.
  #
  # A Payload instance owning platform `public` (ARCHITECTURE.md E4.4's
  # "a Payload instance will own platform public"). Payload provides the
  # auth — real sessions, lockout, password reset, roles — and every console
  # page calls requireUser() before it queries anything.
  #
  # It owns `public.users` and nothing else. The commerce tables stay in
  # `engine`, Alembic-owned, because now_link_resolver reads
  # engine.partnerships on the REQUEST PATH; moving them is its own
  # migration with its own blast radius, not a side effect of adding auth.
  # So commerce data is still read-only here.
  #
  # First deploy must run the Payload migration once:
  #   docker compose ... exec console npx payload migrate
  # then create the first admin at https://<console host>/admin
  # ---------------------------------------------------------------------
  # ---------------------------------------------------------------------
  # cms-{city} — the ONLY services that duplicate, because a Payload
  # instance binds exactly one database (ARCHITECTURE.md §3.5). Same image,
  # different DATABASE_URI. Everything else here is one deployment.
  # ---------------------------------------------------------------------
  # ---------------------------------------------------------------------
  # Media path — behind the `media` profile, OFF by default.
  #
  # E1.3 (mirror wp-content/uploads into Garage) is still blocked, so these
  # two would serve an empty bucket: web/next.config.mjs still points
  # remotePatterns at the legacy WordPress hosts. Running them today costs
  # ~640 MB on a box with ~4 GB free and returns nothing. Turn them on in
  # the same change that unblocks the media migration:
  #
  #     docker compose --profile media up -d
  # ---------------------------------------------------------------------
  garage:
    profiles: ["media"]
    image: dxflrs/garage:v1.3.1
    container_name: now-garage
    restart: unless-stopped
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:-}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:-}
      GARAGE_METRICS_TOKEN: ${GARAGE_METRICS_TOKEN:-}
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    networks: [now-internal]
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768m

  imgproxy:
    profiles: ["media"]
    image: darthsim/imgproxy:v4.0.14
    container_name: now-imgproxy
    restart: unless-stopped
    ports:
      - "127.0.0.1:${IMGPROXY_HOST_PORT:-4314}:8080"
    environment:
      IMGPROXY_BIND: ":8080"
      IMGPROXY_USE_S3: "true"
      IMGPROXY_S3_ENDPOINT: "http://garage:3900"
      IMGPROXY_S3_REGION: ${GARAGE_S3_REGION:-garage}
      AWS_ACCESS_KEY_ID: ${GARAGE_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${GARAGE_SECRET_ACCESS_KEY:-}
      IMGPROXY_KEY: ${IMGPROXY_KEY:-}
      IMGPROXY_SALT: ${IMGPROXY_SALT:-}
      IMGPROXY_ENABLE_WEBP_DETECTION: "true"
      IMGPROXY_TTL: "2592000"
      IMGPROXY_MAX_SRC_RESOLUTION: "50"
    networks: [now-internal]
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m
