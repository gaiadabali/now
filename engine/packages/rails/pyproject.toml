[project]
name = "now-rails"
version = "0.1.0"
description = "E3.5-E3.8 -- the three reader-facing rails (ARCHITECTURE.md Sec.7/Sec.16) and the API that serves them. Composes now-search (semantic kNN), now-filters (hard filters, fallback ladder, MMR diversity, competitor exclusion) and now-blender (weighted blend, real cosine MMR, freshness decay, feature logging) into Row 1 Complementary, Row 2 Nearby and Row 3 Similar -- this package owns no retrieval/scoring math of its own, only the per-rail wiring (subject resolution, rung sequences, rail_cache read-through) those three packages were explicitly built to be composed by. F50: articles.primary_type/format are NULL archive-wide, so competitor exclusion is exercised against synthetic type overlays, exactly as E3.2/E3.3 did; real content only proves the parts of each rail that do not depend on classification (Row 3's real embeddings + real series dedup, in particular)."
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.1,<4",
    "click>=8.1,<9",
    "numpy>=1.26,<3",
    "now-db",
    "now-platform-db",
    "now-search",
    "now-filters",
    "now-blender",
    "now-quality",
    "now-embeddings",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
now-rails = "now_rails.cli:cli"

[tool.uv.sources]
now-db = { path = "../db", editable = true }
now-platform-db = { path = "../platform-db", editable = true }
now-search = { path = "../search", editable = true }
now-filters = { path = "../filters", editable = true }
now-blender = { path = "../blender", editable = true }
now-quality = { path = "../quality", editable = true }
now-embeddings = { path = "../embeddings", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/now_rails"]
