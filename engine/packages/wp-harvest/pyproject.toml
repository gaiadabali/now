[project]
name = "now-wp-harvest"
version = "0.1.0"
description = "Throttled, resumable WordPress REST harvest of a LIVE NOW! site → JSONL. Read-only; complements wp-extract (dump-based) where only the live instance has the answer."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27,<0.29",
    "click>=8.1,<9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
wp-harvest = "wp_harvest.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wp_harvest"]
