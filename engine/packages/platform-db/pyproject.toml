[project]
name = "now-platform-db"
version = "0.1.0"
description = "Alembic-owned `engine` schema for now_platform: sites registry, orgs, partnerships, campaigns, ad ledger, taxonomy, identities, itineraries, syndications."
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "psycopg[binary]>=3.1,<4",
    "click>=8.1,<9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
now-platform-db = "now_platform_db.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/now_platform_db"]
