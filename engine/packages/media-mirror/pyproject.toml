[project]
name = "now-media-mirror"
version = "0.1.0"
description = "Read-only HTTP mirror of live NOW! site media into Garage (S3-compatible). Inventory-first, resumable, polite (rate-limited + backoff)."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27,<0.29",
    "click>=8.1,<9",
    "boto3>=1.34,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
media-mirror = "media_mirror.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/media_mirror"]
