[project]
name = "now-config"
version = "0.1.0"
description = "Typed SiteConfig model + registry loader, shared by every NOW! Engine service."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7,<3",
    "sqlalchemy[asyncio]>=2.0,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/now_config"]
