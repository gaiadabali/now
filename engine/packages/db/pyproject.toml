[project]
name = "now-db"
version = "0.1.0"
description = "Alembic-owned `engine` schema, applied identically to every city DB (now_jakarta, now_bali, ...), plus the site:create / site:migrate runner and the CI schema-hash gate."
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "psycopg[binary]>=3.1,<4",
    "click>=8.1,<9",
    "now-platform-db",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
now-db = "now_db.cli:cli"

[tool.uv.sources]
now-platform-db = { path = "../platform-db", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/now_db"]
