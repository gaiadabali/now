[alembic]
script_location = %(here)s/src/now_db/migrations
prepend_sys_path = .
version_path_separator = os
# sqlalchemy.url is deliberately absent — env.py resolves the connection
# from NOW_CITY_DATABASE_URL (or discrete NOW_PG_* vars + --url), never a
# hardcoded value baked into version control. This same migration set is
# applied to every city DB, one connection at a time.

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
