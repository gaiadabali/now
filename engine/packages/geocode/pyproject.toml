[project]
name = "now-geocode"
version = "0.1.0"
description = "E2.5 — resolves places.jsonl-shaped candidates (venues.jsonl + geo.jsonl free seed) to coordinates via a strict source ladder (existing coords -> structured address -> name+city search -> unresolved/review), assigns an area term from the seeded location tree even when precise geo fails, and emits geocoded_places.jsonl for E2.3/E1.8 to load. Never fabricates coordinates."
requires-python = ">=3.12"
dependencies = [
    "click>=8.1,<9",
    "requests>=2.31,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
now-geocode = "now_geocode.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/now_geocode"]
