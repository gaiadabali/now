[project]
name = "now-inspector"
version = "0.1.0"
description = "E3.4 -- Engine Inspector. Internal debug UI (FastAPI + server-rendered Jinja2, no build step) that shows, for a query or article id: every candidate generator's raw output before fusion, per-component scores with labels, the RRF fusion (both input ranks + fused score), the filter trace (what was removed and by which rule), the fallback rung reached per rail when now-filters is importable, and the quality-score components breakdown. ARCHITECTURE.md Sec.17: built before any public ranking surface so E3.3's blender has something to tune against. Reuses now-search's public SearchEngine/RankedHit/FusedHit/rrf API untouched -- does not modify that package."
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.1,<4",
    "click>=8.1,<9",
    "fastapi>=0.110,<1",
    "uvicorn>=0.29,<1",
    "jinja2>=3.1,<4",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "now-db",
    "now-search",
    "now-blender",
    "now-platform-db",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
now-inspector = "now_inspector.cli:cli"

[tool.uv.sources]
now-db = { path = "../db", editable = true }
now-search = { path = "../search", editable = true }
now-blender = { path = "../blender", editable = true }
now-platform-db = { path = "../platform-db", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/now_inspector"]
