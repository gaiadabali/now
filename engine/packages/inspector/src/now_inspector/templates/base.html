<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{{ title or "Engine Inspector" }}</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    font-family: ui-monospace, "SF Mono", Consolas, "Courier New", monospace;
    font-size: 13px;
    margin: 0;
    padding: 16px 24px 64px;
    background: #0b0e12;
    color: #d8dee6;
    line-height: 1.45;
  }
  a { color: #6cb6ff; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  h2 { font-size: 14px; margin: 28px 0 8px; border-bottom: 1px solid #2a2f38; padding-bottom: 4px; color: #eaeef2; }
  h3 { font-size: 12.5px; margin: 4px 0 6px; color: #b7c0cc; }
  .subtitle { color: #8a93a0; margin-bottom: 18px; }
  form.top { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 8px; }
  input[type=text] { background: #12161c; border: 1px solid #2a2f38; color: #d8dee6; padding: 6px 8px; border-radius: 4px; min-width: 260px; font-family: inherit; }
  button { background: #1c2733; border: 1px solid #3a4a5c; color: #d8dee6; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-family: inherit; }
  button:hover { background: #24333f; }
  table { border-collapse: collapse; width: 100%; margin-bottom: 6px; }
  th, td { border: 1px solid #23282f; padding: 4px 7px; text-align: left; vertical-align: top; }
  th { background: #161b21; color: #9fb0c2; font-weight: 600; position: sticky; top: 0; }
  tr:nth-child(even) td { background: #10141a; }
  .pill { display: inline-block; padding: 1px 7px; border-radius: 10px; font-size: 11px; }
  .pill-ok { background: #163f26; color: #7fdc9a; }
  .pill-removed { background: #4a1a1a; color: #ff9a9a; }
  .pill-warn { background: #4a3a12; color: #f0c674; }
  .pill-gap { background: #2a2a3a; color: #b0aef0; }
  .muted { color: #6f7885; }
  .not-classified { color: #f0c674; font-style: italic; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .card { background: #10141a; border: 1px solid #202730; border-radius: 6px; padding: 10px 12px; margin-bottom: 14px; }
  .kv { display: grid; grid-template-columns: 130px 1fr; gap: 2px 10px; }
  .kv div.k { color: #8a93a0; }
  .mono-num { font-variant-numeric: tabular-nums; }
  .section-note { color: #8a93a0; font-size: 12px; margin: -2px 0 10px; }
  details summary { cursor: pointer; color: #9fb0c2; }
  code.small { font-size: 11.5px; color: #9fb0c2; }
  .badge-count { color: #6f7885; font-weight: normal; }
  .footer-nav { margin-top: 30px; color: #6f7885; }
</style>
</head>
<body>
<h1>Engine Inspector</h1>
<div class="subtitle">E3.4 -- internal debug surface. Not a product page. Zero site-name literals; reads real Postgres data.</div>
<form class="top" method="get" action="/inspect">
  <label>Query <input type="text" name="q" value="{{ query or '' }}" placeholder="rooftop bar senopati"></label>
  <span class="muted">or</span>
  <label>Article id <input type="text" name="article_id" value="{{ article_id or '' }}" placeholder="3899" style="min-width:80px"></label>
  <button type="submit">Inspect</button>
</form>
{% block body %}{% endblock %}
<div class="footer-nav">now-inspector · engine/packages/inspector · ARCHITECTURE.md §17</div>
</body>
</html>
