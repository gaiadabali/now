[project]
name = "now-wp-extract"
version = "0.1.0"
description = "One-shot WordPress/UpdraftPlus → JSONL extraction for the NOW! Jakarta migration (E1.1). MariaDB restore + SQL extraction; no ongoing sync, no WP in production."
requires-python = ">=3.12"
dependencies = [
    "pymysql>=1.1,<2",
    "phpserialize>=1.3,<2",
    "click>=8.1,<9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
wp-extract = "wp_extract.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wp_extract"]
